<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0; padding: 16px;
      background: #f5f7fa; font-size: 13px;
    }
    .header {
      background: linear-gradient(135deg, #2c3e50 0%, #3d5166 100%);
      color: white; padding: 16px; text-align: center;
      border-radius: 12px; margin: -16px -16px 16px -16px;
    }
    .header h3 { margin: 0; font-size: 16px; font-weight: 600; }
    .section {
      background: white; border-radius: 10px; padding: 14px;
      margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .section-title {
      font-size: 11px; font-weight: 700; color: #7f8c8d;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px;
    }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .input-group label { display: block; font-weight: 600; font-size: 11px; color: #555; margin-bottom: 4px; }
    .hint { font-size: 10px; color: #aaa; margin-top: 2px; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; }
    input[type="text"] {
      width: 100%; padding: 7px 10px;
      border: 1px solid #dce1e7; border-radius: 6px;
      font-size: 12px; background: #f8f9fa;
    }
    input[type="text"]:focus { outline: none; border-color: #2c3e50; background: white; }
    input[type="text"]:disabled { opacity: 0.35; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .btn-row:last-child { margin-bottom: 0; }
    .btn {
      padding: 7px 13px; border: none; border-radius: 6px;
      cursor: pointer; font-size: 12px; font-weight: 600;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.82; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost  { background: #ecf0f1; color: #555; }
    .btn-dark   { background: #2c3e50; color: white; }
    .btn-blue   { background: #2980b9; color: white; }
    .btn-amber  { background: #e67e22; color: white; }
    .btn-hide   { background: #7f8c8d; color: white; }
    .btn-show   { background: #16a085; color: white; }
    .sheet-list {
      max-height: 220px; overflow-y: auto;
      border: 1px solid #dce1e7; border-radius: 8px; background: white;
    }
    .sheet-item {
      display: flex; align-items: center;
      padding: 8px 12px; border-bottom: 1px solid #f2f3f4; gap: 8px;
    }
    .sheet-item:last-child { border-bottom: none; }
    .sheet-name { flex: 1; font-size: 13px; }
    .sheet-name.is-hidden { color: #bdc3c7; text-decoration: line-through; }
    .hidden-badge {
      font-size: 10px; background: #f2f3f4; color: #95a5a6;
      padding: 2px 6px; border-radius: 4px;
    }
    .result {
      margin-top: 10px; padding: 10px; border-radius: 6px;
      font-size: 12px; white-space: pre-line;
    }
    .result.success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }
    .result.error   { background: #fdedec; color: #922b21; border: 1px solid #f1948a; }
    .sheet-list::-webkit-scrollbar { width: 5px; }
    .sheet-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="header">
    <h3>📑 Gerenciador de Abas</h3>
  </div>

  <div class="section">
    <div class="section-title">Opção de Renomeação</div>
    <div class="controls">
      <div class="input-group">
        <label><div class="checkbox-row"><input type="checkbox" id="prefixCheck"> Prefixo</div></label>
        <input type="text" id="prefix" placeholder="Texto antes" disabled>
      </div>
      <div class="input-group">
        <label><div class="checkbox-row"><input type="checkbox" id="suffixCheck"> Sufixo</div></label>
        <input type="text" id="suffix" placeholder="Texto depois" disabled>
      </div>
      <div class="input-group">
        <label><div class="checkbox-row"><input type="checkbox" id="renameCompleteCheck"> Novo Nome</div></label>
        <input type="text" id="newBaseName" placeholder="Nome base" disabled>
        <div class="hint">Ex: "Piso" → Piso 1, Piso 2…</div>
      </div>
      <div class="input-group">
        <label><div class="checkbox-row"><input type="checkbox" id="findReplaceCheck"> Localizar / Substituir</div></label>
        <input type="text" id="findText" placeholder="Localizar" disabled>
        <input type="text" id="replaceText" placeholder="Substituir por" disabled style="margin-top:5px;">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Ações</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="selectAll()">✅ Marcar Todos</button>
      <button class="btn btn-ghost" onclick="unselectAll()">☐ Desmarcar</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-dark"  onclick="renameSheets()">✏️ Renomear</button>
      <button class="btn btn-blue"  onclick="duplicateSheets()">📋 Duplicar</button>
      <button class="btn btn-amber" onclick="duplicateAndRenameSheets()">📋✏️ Dupl + Renomear</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-hide" onclick="hideSheets()">👁 Ocultar Selecionadas</button>
      <button class="btn btn-show" onclick="unhideSheets()">👁 Mostrar Selecionadas</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Abas da Planilha</div>
    <div class="sheet-list" id="sheetList"></div>
    <div id="result"></div>
  </div>

  <script>
    const inputMap = {
      prefixCheck:         ['prefix'],
      suffixCheck:         ['suffix'],
      renameCompleteCheck: ['newBaseName'],
      findReplaceCheck:    ['findText','replaceText']
    };
    const checkboxIds = Object.keys(inputMap);

    // Ultimo checkbox da lista de abas clicado (para seleção em lote com Shift)
    let lastChecked = null;

    checkboxIds.forEach(id => {
      document.getElementById(id).addEventListener('change', function() {
        if (this.checked) {
          checkboxIds.filter(o => o !== id).forEach(other => {
            document.getElementById(other).checked = false;
            inputMap[other].forEach(inp => {
              const el = document.getElementById(inp);
              el.disabled = true; el.value = '';
            });
          });
        }
        inputMap[id].forEach(inp => {
          document.getElementById(inp).disabled = !this.checked;
        });
      });
    });

    function loadSheets() {
      google.script.run
        .withSuccessHandler(displaySheets)
        .withFailureHandler(showError)
        .getAllSheetNamesWithStatus();
    }

    function displaySheets(sheets) {
      const container = document.getElementById('sheetList');
      container.innerHTML = '';
      lastChecked = null;  // a lista foi recriada; descarta referência antiga
      sheets.forEach(s => {
        const item = document.createElement('div');
        item.className = 'sheet-item';

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.value = s.name;
        cb.addEventListener('click', onCheckboxClick);

        const nameSpan = document.createElement('span');
        nameSpan.className = 'sheet-name' + (s.isHidden ? ' is-hidden' : '');
        nameSpan.textContent = s.name;

        item.appendChild(cb);
        item.appendChild(nameSpan);

        if (s.isHidden) {
          const badge = document.createElement('span');
          badge.className = 'hidden-badge';
          badge.textContent = 'oculta';
          item.appendChild(badge);
        }
        container.appendChild(item);
      });
    }

    function onCheckboxClick(e) {
      const boxes = Array.from(document.querySelectorAll('#sheetList input[type="checkbox"]'));
      if (e.shiftKey && lastChecked && lastChecked !== this) {
        const start = boxes.indexOf(lastChecked);
        const end   = boxes.indexOf(this);
        const lo = Math.min(start, end), hi = Math.max(start, end);
        for (let i = lo; i <= hi; i++) boxes[i].checked = this.checked;
      }
      lastChecked = this;
    }

    function getSelected() {
      return Array.from(
        document.querySelectorAll('#sheetList input[type="checkbox"]:checked')
      ).map(cb => cb.value);
    }

    function selectAll()   { document.querySelectorAll('#sheetList input').forEach(cb => cb.checked = true); }
    function unselectAll() { document.querySelectorAll('#sheetList input').forEach(cb => cb.checked = false); }

    function renameSheets() {
      const selected = getSelected();
      if (!selected.length) { showError('Selecione pelo menos uma aba'); return; }
      const prefix  = document.getElementById('prefix').value;
      const suffix  = document.getElementById('suffix').value;
      const newBase = document.getElementById('newBaseName').value.trim();
      const find    = document.getElementById('findText').value.trim();
      const replace = document.getElementById('replaceText').value.trim();

      if (document.getElementById('renameCompleteCheck').checked) {
        if (!newBase) { showError('Digite o novo nome base'); return; }
        call('renameCompleteSelected', selected, newBase);
      } else if (document.getElementById('findReplaceCheck').checked) {
        if (!find) { showError('Digite o texto a localizar'); return; }
        call('findAndReplaceSelected', selected, find, replace);
      } else {
        if (!prefix && !suffix) { showError('Digite prefixo ou sufixo'); return; }
        call('renameSelected', selected, prefix, suffix);
      }
    }

    function duplicateSheets() {
      const selected = getSelected();
      if (!selected.length) { showError('Selecione pelo menos uma aba'); return; }
      call('duplicateSelected', selected);
    }

    function duplicateAndRenameSheets() {
      const selected = getSelected();
      if (!selected.length) { showError('Selecione pelo menos uma aba'); return; }
      const prefix  = document.getElementById('prefix').value;
      const suffix  = document.getElementById('suffix').value;
      const newBase = document.getElementById('newBaseName').value.trim();
      const find    = document.getElementById('findText').value.trim();
      const replace = document.getElementById('replaceText').value.trim();

      if (document.getElementById('renameCompleteCheck').checked) {
        if (!newBase) { showError('Digite o novo nome base'); return; }
        call('duplicateAndRenameComplete', selected, newBase);
      } else if (document.getElementById('findReplaceCheck').checked) {
        if (!find) { showError('Digite o texto a localizar'); return; }
        call('duplicateAndFindReplace', selected, find, replace);
      } else {
        if (!prefix && !suffix) { showError('Digite prefixo ou sufixo'); return; }
        call('duplicateAndRename', selected, prefix, suffix);
      }
    }

    function hideSheets() {
      const selected = getSelected();
      if (!selected.length) { showError('Selecione pelo menos uma aba'); return; }
      call('hideSelected', selected);
    }

    function unhideSheets() {
      const selected = getSelected();
      if (!selected.length) { showError('Selecione pelo menos uma aba'); return; }
      call('unhideSelected', selected);
    }

    function call(fnName, ...args) {
      let runner = google.script.run
        .withSuccessHandler(showSuccess)
        .withFailureHandler(showError);
      runner[fnName](...args);
    }

    function showSuccess(results) {
      const div = document.getElementById('result');
      div.className = 'result success';
      div.textContent = 'Concluído:\n' + results.join('\n');
      loadSheets();
    }

    function showError(error) {
      const div = document.getElementById('result');
      div.className = 'result error';
      div.textContent = 'Erro: ' + (error.message || error);
    }

    loadSheets();
  </script>
</body>
</html>
