<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a73e8; --primary-dark: #1557b0;
      --success: #34a853; --danger: #ea4335;
      --bg: #f8f9fa; --surface: #ffffff;
      --border: #dadce0; --text: #202124;
      --text-light: #5f6368; --hover: #e8f0fe;
      --chip-bg: #e8f0fe; --chip-text: #1a73e8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg);
      display: flex; flex-direction: column;
      height: 100vh; overflow: hidden;
      font-size: 13px; color: var(--text);
    }

    /* ── CONFIG ── */
    .config-header {
      background: #e8eaed; padding: 8px 16px;
      font-size: 11px; color: var(--text-light);
      cursor: pointer; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
    }
    .config-panel {
      display: none; background: #f1f3f4;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-direction: column; gap: 8px;
      flex-shrink: 0;
    }
    .config-panel.open { display: flex; }
    .config-row { display: flex; gap: 8px; align-items: center; }
    .config-row label { width: 52px; font-weight: 500; flex-shrink: 0; }
    select {
      flex: 1; padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 4px; background: white;
      font-size: 12px; font-family: inherit;
    }
    .btn-reload {
      background: var(--text-light); color: white;
      border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer;
      font-size: 12px; font-family: inherit;
      width: 100%;
    }
    .btn-reload:hover { background: #444; }

    /* ── PAINEL DE SELECIONADOS ── */
    .selected-panel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: none;
    }
    .selected-panel-header {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
    }
    .selected-panel-header span {
      font-size: 11px; font-weight: 500;
      color: var(--primary);
    }
    .btn-clear-all {
      background: none; border: none;
      font-size: 11px; color: var(--danger);
      cursor: pointer; padding: 2px 6px;
      border-radius: 3px;
    }
    .btn-clear-all:hover { background: #fce8e6; }
    .chips-container {
      display: flex; flex-wrap: wrap;
      gap: 4px; padding: 0 12px 8px;
      max-height: 80px; overflow-y: auto;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--chip-bg); color: var(--chip-text);
      border-radius: 12px; padding: 3px 8px;
      font-size: 11px; font-weight: 500;
      max-width: 160px;
    }
    .chip-name {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chip-remove {
      background: none; border: none;
      color: var(--chip-text); cursor: pointer;
      font-size: 13px; line-height: 1;
      padding: 0; flex-shrink: 0;
      opacity: 0.7;
    }
    .chip-remove:hover { opacity: 1; }

    /* ── BUSCA ── */
    .search-header {
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .search-wrapper {
      position: relative;
    }
    .search-icon {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-light); font-size: 14px;
      pointer-events: none;
    }
    input#searchInput {
      width: 100%; padding: 8px 30px 8px 32px;
      border: 1px solid var(--border);
      border-radius: 20px; font-size: 13px;
      outline: none; font-family: inherit;
      background: var(--bg);
    }
    input#searchInput:focus {
      border-color: var(--primary);
      background: white;
    }
    .search-hint {
      margin-top: 5px; padding: 0 4px;
      font-size: 10px; color: var(--text-light);
    }
    .search-hint code {
      background: #eef0f2; border-radius: 3px; padding: 0 3px;
      font-family: inherit; color: var(--text);
    }
    .clear-search {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--text-light); cursor: pointer;
      font-size: 16px; display: none;
      padding: 0; line-height: 1;
    }

    /* ── RESULTADOS ── */
    .results-info {
      padding: 4px 12px;
      font-size: 11px; color: var(--text-light);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: none;
    }
    .results-container {
      flex: 1; overflow-y: auto;
    }
    .result-item {
      padding: 8px 16px; cursor: pointer;
      display: flex; align-items: flex-start; gap: 10px;
      color: var(--text);
      outline: none;
      border-bottom: 1px solid #eef0f2;
    }
    .result-item:hover { background: #f1f3f4; }
    .result-item.selected { background: var(--hover); color: var(--primary); font-weight: 500; }
    .result-item.focused { outline: 2px solid var(--primary); outline-offset: -2px; }
    .custom-check {
      width: 16px; height: 16px;
      border: 2px solid #5f6368; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; background: white;
      margin-top: 1px;
    }
    .result-item.selected .custom-check {
      background: var(--primary); border-color: var(--primary);
    }
    .check-mark {
      color: white; font-size: 11px; font-weight: bold; display: none;
    }
    .result-item.selected .check-mark { display: block; }
    /* Nome inteiro: quebra em várias linhas em vez de cortar com "..." */
    .item-text { flex: 1; min-width: 0; white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }
    .empty-msg {
      padding: 24px 16px; text-align: center;
      color: var(--text-light); font-size: 12px;
    }

    /* ── FOOTER ── */
    .footer {
      padding: 10px 16px; background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .footer-info { font-size: 11px; color: var(--text-light); }
    button#btnInsert {
      background: var(--primary); color: white;
      border: none; padding: 8px 20px;
      border-radius: 4px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      font-size: 12px; opacity: 0.5; pointer-events: none;
      transition: background 0.15s;
    }
    button#btnInsert.active { opacity: 1; pointer-events: auto; }
    button#btnInsert.active:hover { background: var(--primary-dark); }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      background: #323232; color: white;
      padding: 8px 16px; border-radius: 4px;
      font-size: 12px; display: none; z-index: 100;
      white-space: nowrap;
    }
    .toast.error { background: var(--danger); }
    .toast.success { background: var(--success); }
  </style>
</head>
<body>

  <!-- CONFIGURAÇÃO -->
  <div class="config-header" onclick="toggleConfig()" title="Clique para configurar a fonte de dados">
    <span>⚙️ Fonte de Dados</span>
    <span id="configIcon">▼</span>
  </div>
  <div class="config-panel" id="configPanel">
    <div class="config-row">
      <label>Aba:</label>
      <select id="sheetSelect" onchange="onSheetChange()"></select>
    </div>
    <div class="config-row">
      <label>Coluna:</label>
      <select id="colSelect" onchange="onColChange()"></select>
    </div>
    <button class="btn-reload" onclick="reloadData(true)">↺ Atualizar Lista</button>
  </div>

  <!-- PAINEL DE SELECIONADOS -->
  <div class="selected-panel" id="selectedPanel">
    <div class="selected-panel-header">
      <span id="selectedCount">0 selecionados</span>
      <button class="btn-clear-all" onclick="clearAllSelected()">Limpar tudo</button>
    </div>
    <div class="chips-container" id="chipsContainer"></div>
  </div>

  <!-- BUSCA -->
  <div class="search-header">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar..." autocomplete="off" autofocus>
      <button class="clear-search" id="clearSearch" onclick="clearSearchInput()" title="Limpar">✕</button>
    </div>
    <div class="search-hint"><code>"pvc"</code> palavra exata (não traz CPVC) · <code>-cpvc</code> excluir</div>
  </div>

  <!-- INFO DE RESULTADOS -->
  <div class="results-info" id="resultsInfo"></div>

  <!-- LISTA -->
  <div class="results-container" id="resultsList">
    <div class="empty-msg">Carregando...</div>
  </div>

  <!-- RODAPÉ -->
  <div class="footer">
    <span class="footer-info" id="statusText">0 selecionado(s)</span>
    <button id="btnInsert" onclick="inserirDados()">INSERIR</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let rawData    = [];        // todos os dados da coluna
    let rawLower   = [];        // rawData em minúsculas (calculado 1x, não a cada tecla)
    let filtered   = [];        // resultado do filtro atual
    let selectedSet = new Set(); // itens selecionados
    let focusedIdx  = -1;       // índice focado por teclado
    let searchTimer = null;
    const MAX_RENDER = 300;     // teto de linhas no DOM; o contador mostra o total encontrado

    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================
    window.onload = () => {
      // Registra listener de teclado UMA VEZ
      document.getElementById('searchInput').addEventListener('input', onSearchInput);
      document.getElementById('searchInput').addEventListener('keydown', onSearchKeydown);

      google.script.run
        .withSuccessHandler(onInitData)
        .withFailureHandler(err => showToast('Erro ao carregar: ' + err.message, 'error'))
        .getSuperBuscaInitData();
    };

    function onInitData(data) {
      // Escolhe aba inicial: userState → defaultSheet
      const targetSheet = (data.userState && data.userState.sheetName) || data.defaultSheet;
      const targetCol   = (data.userState && data.userState.colIndex)  || data.defaultCol;

      // Popula dropdown de abas
      const sheetSel = document.getElementById('sheetSelect');
      sheetSel.innerHTML = '';
      data.sheets.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        opt.selected = (name === targetSheet);
        sheetSel.appendChild(opt);
      });

      // Carrega colunas da aba selecionada
      loadColumnsForSheet(targetCol, true);
    }

    function loadColumnsForSheet(targetColIndex, isFirstLoad, persistAfter) {
      const sheetName = document.getElementById('sheetSelect').value;
      const colSel = document.getElementById('colSelect');
      colSel.innerHTML = '<option>...</option>';
      colSel.disabled = true;

      google.script.run
        .withSuccessHandler(headers => {
          colSel.innerHTML = '';
          colSel.disabled = false;
          headers.forEach(h => {
            const opt = document.createElement('option');
            opt.value = h.index;
            opt.textContent = h.name;
            opt.selected = (h.index === targetColIndex);
            colSel.appendChild(opt);
          });
          if (isFirstLoad) reloadData();
          if (persistAfter) persistState();
        })
        .withFailureHandler(err => {
          colSel.disabled = false;
          showToast('Erro ao carregar colunas: ' + err.message, 'error');
        })
        .getColumnHeaders(sheetName);
    }

    // =========================================================
    // EVENTOS DE CONFIG
    // =========================================================
    function onSheetChange() {
      // persiste só depois que as colunas da aba nova carregam (antes o select
      // ainda estava em "..." e a troca de aba não era salva)
      loadColumnsForSheet(null, true, true);
    }

    function onColChange() {
      persistState();
      reloadData();   // antes a lista continuava sendo a da coluna anterior
    }

    function persistState() {
      const sheetName = document.getElementById('sheetSelect').value;
      const colIndex  = Number(document.getElementById('colSelect').value);
      if (!sheetName || !colIndex) return;
      google.script.run.saveSuperBuscaState(sheetName, colIndex);
    }

    function toggleConfig() {
      const panel = document.getElementById('configPanel');
      panel.classList.toggle('open');
      document.getElementById('configIcon').textContent = panel.classList.contains('open') ? '▲' : '▼';
    }

    function reloadData(force) {
      const list = document.getElementById('resultsList');
      list.innerHTML = '<div class="empty-msg">Carregando dados...</div>';
      document.getElementById('resultsInfo').style.display = 'none';
      focusedIdx = -1;

      const sheetVal = document.getElementById('sheetSelect').value;
      const colVal   = document.getElementById('colSelect').value;

      google.script.run
        .withSuccessHandler(onDataLoaded)
        .withFailureHandler(err => {
          list.innerHTML = `<div class="empty-msg">Erro: ${err.message}</div>`;
        })
        .getDadosParaBusca(sheetVal, colVal, !!force);
    }

    function onDataLoaded(data) {
      rawData = data || [];
      rawLower = rawData.map(s => s.toLowerCase());
      filtered = [];
      renderEmptyState();
      // Reabre com a busca atual se houver
      const q = document.getElementById('searchInput').value;
      if (q.trim()) runFilter();
    }

    // =========================================================
    // BUSCA E FILTRO
    // =========================================================
    function onSearchInput() {
      const val = document.getElementById('searchInput').value;
      document.getElementById('clearSearch').style.display = val ? 'block' : 'none';
      focusedIdx = -1;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runFilter, 120);
    }

    /**
     * Quebra a busca em termos:
     *   pvc        contém            (casa PVC e CPVC)
     *   "pvc"      palavra exata     (casa PVC, não CPVC) — aceita frase: "2 in"
     *   -cpvc      exclui quem contém;  -"dwv" exclui pela palavra exata
     * Aspa ainda não fechada já vale como exata, para filtrar enquanto digita.
     */
    function parseQuery(query) {
      const terms = [];
      const re = /(-?)"([^"]*)"?|(-?)(\S+)/g;
      let m;
      while ((m = re.exec(query)) !== null) {
        const exact = m[2] !== undefined;
        const text  = (exact ? m[2] : m[4]).trim().replace(/\s+/g, ' ');
        const neg   = (exact ? m[1] : m[3]) === '-';
        if (text && text !== '-') terms.push({ text, exact, neg });
      }
      return terms;
    }

    const _isAlnum = c => /[a-z0-9]/.test(c);
    const _isDigit = c => c >= '0' && c <= '9';

    /**
     * Palavra exata: o termo não pode estar colado em letra/número.
     * Medida também conta: "2" não casa o 2 de 1/2, 1-1/2 nem 2-1/2.
     */
    function hasWholeTerm(lower, term) {
      const startsDigit = _isDigit(term[0]);
      const endsDigit   = _isDigit(term[term.length - 1]);
      let i = lower.indexOf(term);
      while (i !== -1) {
        const end  = i + term.length;
        const prev = i > 0 ? lower[i - 1] : '';
        const next = end < lower.length ? lower[end] : '';
        const gluedBefore = prev && (_isAlnum(prev) ||
          (startsDigit && '/-.'.includes(prev) && i >= 2 && _isDigit(lower[i - 2])));
        const gluedAfter = next && (_isAlnum(next) ||
          (endsDigit && '/-.'.includes(next) && _isDigit(lower[end + 1] || '')));
        if (!gluedBefore && !gluedAfter) return true;
        i = lower.indexOf(term, i + 1);
      }
      return false;
    }

    function runFilter() {
      const terms = parseQuery(document.getElementById('searchInput').value.toLowerCase());
      // Só exclusões ("-cpvc" sozinho) não filtram nada: precisa de um termo positivo
      if (!terms.some(t => !t.neg)) {
        filtered = [];
        renderEmptyState();
        return;
      }
      filtered = rawData.filter((item, idx) => {
        const lower = rawLower[idx];
        return terms.every(t => {
          const hit = t.exact ? hasWholeTerm(lower, t.text) : lower.includes(t.text);
          return t.neg ? !hit : hit;
        });
      });
      renderList();
    }

    function clearSearchInput() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearch').style.display = 'none';
      filtered = [];
      renderEmptyState();
      focusedIdx = -1;
      document.getElementById('searchInput').focus();
    }

    // =========================================================
    // RENDERIZAÇÃO
    // =========================================================
    function renderEmptyState() {
      const info = document.getElementById('resultsInfo');
      info.style.display = 'none';
      const container = document.getElementById('resultsList');
      const div = document.createElement('div');
      div.className = 'empty-msg';
      div.textContent = rawData.length > 0 ? 'Digite para filtrar...' : 'Lista vazia.';
      container.innerHTML = '';
      container.appendChild(div);
    }

    function renderList() {
      const container = document.getElementById('resultsList');
      container.innerHTML = '';
      focusedIdx = -1;

      const info = document.getElementById('resultsInfo');
      if (filtered.length === 0) {
        info.style.display = 'none';
        const div = document.createElement('div');
        div.className = 'empty-msg';
        div.textContent = 'Nenhum resultado.';
        container.appendChild(div);
        return;
      }

      const shown = Math.min(filtered.length, MAX_RENDER);
      info.textContent = filtered.length > MAX_RENDER
        ? `${filtered.length} de ${rawData.length} itens — mostrando ${shown}, refine a busca`
        : `${filtered.length} de ${rawData.length} itens`;
      info.style.display = 'block';

      filtered.slice(0, MAX_RENDER).forEach((text, idx) => {
        const div = document.createElement('div');
        div.className = 'result-item' + (selectedSet.has(text) ? ' selected' : '');
        div.dataset.idx = idx;
        div.tabIndex = -1;

        const check = document.createElement('div');
        check.className = 'custom-check';
        const mark = document.createElement('span');
        mark.className = 'check-mark';
        mark.textContent = '✓';
        check.appendChild(mark);

        const span = document.createElement('span');
        span.className = 'item-text';
        span.textContent = text; // seguro — textContent

        div.appendChild(check);
        div.appendChild(span);

        div.addEventListener('click', () => toggleItem(text, div));
        container.appendChild(div);
      });
    }

    // =========================================================
    // NAVEGAÇÃO POR TECLADO
    // ↑↓ navega, Space seleciona, Enter insere
    // =========================================================
    function onSearchKeydown(e) {
      const items = document.querySelectorAll('.result-item');
      if (items.length === 0) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        setFocused(Math.min(focusedIdx + 1, items.length - 1), items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        setFocused(Math.max(focusedIdx - 1, 0), items);
      } else if (e.key === ' ' && focusedIdx >= 0) {
        e.preventDefault();
        const text = filtered[focusedIdx];
        if (text !== undefined) toggleItem(text, items[focusedIdx]);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (focusedIdx >= 0 && filtered[focusedIdx] !== undefined) {
          // Seleciona o item focado se ainda não estiver selecionado
          const text = filtered[focusedIdx];
          if (!selectedSet.has(text)) toggleItem(text, items[focusedIdx]);
        }
        if (selectedSet.size > 0) inserirDados();
      } else if (e.key === 'Escape') {
        clearSearchInput();
      }
    }

    function setFocused(idx, items) {
      if (focusedIdx >= 0 && items[focusedIdx]) {
        items[focusedIdx].classList.remove('focused');
      }
      focusedIdx = idx;
      if (items[focusedIdx]) {
        items[focusedIdx].classList.add('focused');
        items[focusedIdx].scrollIntoView({ block: 'nearest' });
      }
    }

    // =========================================================
    // SELEÇÃO
    // =========================================================
    function toggleItem(text, el) {
      if (selectedSet.has(text)) {
        selectedSet.delete(text);
        el.classList.remove('selected');
      } else {
        selectedSet.add(text);
        el.classList.add('selected');
      }
      updateFooter();
      updateSelectedPanel();
    }

    function clearAllSelected() {
      selectedSet.clear();
      document.querySelectorAll('.result-item.selected').forEach(el => el.classList.remove('selected'));
      updateFooter();
      updateSelectedPanel();
    }

    function removeFromSelection(text) {
      selectedSet.delete(text);
      // Remove classe do item visível, se existir
      document.querySelectorAll('.result-item').forEach(el => {
        const span = el.querySelector('.item-text');
        if (span && span.textContent === text) el.classList.remove('selected');
      });
      updateFooter();
      updateSelectedPanel();
    }

    // =========================================================
    // PAINEL DE SELECIONADOS (CHIPS)
    // =========================================================
    function updateSelectedPanel() {
      const panel    = document.getElementById('selectedPanel');
      const chips    = document.getElementById('chipsContainer');
      const countEl  = document.getElementById('selectedCount');
      const count    = selectedSet.size;

      chips.innerHTML = '';
      panel.style.display = count > 0 ? 'block' : 'none';
      countEl.textContent = `${count} selecionado(s)`;

      selectedSet.forEach(text => {
        const chip = document.createElement('div');
        chip.className = 'chip';

        const name = document.createElement('span');
        name.className = 'chip-name';
        name.textContent = text;
        name.title = text;

        const btn = document.createElement('button');
        btn.className = 'chip-remove';
        btn.textContent = '×';
        btn.title = 'Remover';
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          removeFromSelection(text);
        });

        chip.appendChild(name);
        chip.appendChild(btn);
        chips.appendChild(chip);
      });
    }

    // =========================================================
    // FOOTER
    // =========================================================
    function updateFooter() {
      const count = selectedSet.size;
      document.getElementById('statusText').textContent = `${count} selecionado(s)`;
      const btn = document.getElementById('btnInsert');
      if (count > 0) {
        btn.classList.add('active');
        btn.textContent = `INSERIR (${count})`;
      } else {
        btn.classList.remove('active');
        btn.textContent = 'INSERIR';
      }
    }

    // =========================================================
    // INSERIR
    // =========================================================
    function inserirDados() {
      const itens = Array.from(selectedSet);
      if (itens.length === 0) return;

      const btn = document.getElementById('btnInsert');
      btn.textContent = '...';
      btn.classList.remove('active');

      google.script.run
        .withSuccessHandler(result => {
          if (result && result.success) {
            showToast(`✓ ${result.data.inserted} item(s) inserido(s)`, 'success');
            // Só a seleção é limpa — a busca e a lista ficam, para inserir mais itens
            clearAllSelected();
            const input = document.getElementById('searchInput');
            input.focus();
          } else {
            showToast('Erro: ' + (result && result.error ? result.error : 'Falha desconhecida'), 'error');
            updateFooter();
          }
        })
        .withFailureHandler(err => {
          showToast('Erro ao inserir: ' + err.message, 'error');
          updateFooter();
        })
        .inserirItensSelecionados(itens);
    }

    // =========================================================
    // TOAST
    // =========================================================
    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `toast${type ? ' ' + type : ''}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }
  </script>
</body>
</html>
