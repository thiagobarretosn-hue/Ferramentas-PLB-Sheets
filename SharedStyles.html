<!-- Estilos base compartilhados entre sidebars (via include('SharedStyles')) -->
<style>
  :root {
    --plb-dark:   #2c3e50;
    --plb-blue:   #3498db;
    --plb-green:  #27ae60;
    --plb-red:    #e74c3c;
    --plb-amber:  #f1c232;
    --plb-grey:   #7f8c8d;
    --plb-border: #bdc3c7;
    --plb-bg:     #f8f9fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; font-size: 12px; color: var(--plb-dark); background: var(--plb-bg); }
  .header { background: var(--plb-dark); color: #fff; padding: 10px 14px; font-weight: bold; font-size: 13px; }
  .section { padding: 10px 14px; border-bottom: 1px solid #e0e0e0; background: #fff; }
  .section-title { font-weight: bold; color: var(--plb-dark); margin-bottom: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  label { display: block; margin-bottom: 2px; color: #555; font-size: 10px; }
  select, input[type="text"], input[type="number"] {
    width: 100%; padding: 4px 6px; border: 1px solid var(--plb-border); border-radius: 3px;
    font-size: 11px; margin-bottom: 6px; background: #fff;
  }
  select:focus, input:focus { outline: none; border-color: var(--plb-blue); }
  .row2 { display: flex; gap: 6px; }
  .row2 > div { flex: 1; }
  .btn { padding: 5px 10px; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; }
  .btn:disabled { background: #95a5a6; cursor: not-allowed; }
  .btn-primary { background: var(--plb-green); color: #fff; width: 100%; padding: 10px; font-size: 13px; font-weight: bold; margin-top: 4px; }
  .btn-secondary { background: var(--plb-blue); color: #fff; }
  .btn-danger { background: var(--plb-red); color: #fff; }
  .btn-small { padding: 2px 7px; font-size: 10px; }
  .status-ok { color: var(--plb-green); }
  .status-err { color: var(--plb-red); }
  .loading { color: var(--plb-grey); font-style: italic; }
</style>
