<!-- JS utilitário compartilhado entre sidebars (via include('SharedScripts')) -->
<script>
  /** google.script.run como Promise: runGS('minhaFn', a, b).then(...).catch(...) */
  function runGS(fnName) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function(resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject);
      runner[fnName].apply(runner, args);
    });
  }

  /** Debounce simples — usado para autosave de configuração */
  function debounce(fn, ms) {
    var t = null;
    return function() {
      var self = this, args = arguments;
      clearTimeout(t);
      t = setTimeout(function() { fn.apply(self, args); }, ms);
    };
  }

  /** Escapa texto para injeção segura em innerHTML */
  function escHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/"/g, '&quot;')
      .replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>
